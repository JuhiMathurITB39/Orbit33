[project]
name = "orbit"
version = "0.1.0"
description = "ORBIT - Operational Reasoning, Business Intelligence and Technology Platform"
requires-python = ">=3.11"
# Runtime dependencies actually used by this repository (verified importable in the build environment).
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "joblib>=1.4",
  "requests>=2.31",
]

[project.optional-dependencies]
# Declared by the original spec but NOT usable in the build sandbox (package index blocked).
# See DECISIONS.md. Code paths that would use them are isolated behind interfaces.
spec_stack = [
  "fastapi>=0.110", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pyarrow>=15",
  "xgboost>=2.0", "lightgbm>=4.3", "statsmodels>=0.14", "mlflow>=2.12",
  "dbt-postgres>=1.8", "apache-airflow>=2.9",
]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -ra"
markers = [
  "slow: end-to-end tests that build the full dataset and train models",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E702", "B905"]  # long lines in tables/SQL and compact one-line statements are deliberate

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbit*"]
